<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartQuiz AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f7f7f8;
            color: #202123;
        }

        .header {
            height: 65px;
            background: #ffffff;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            padding: 0 30px;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .logo span {
            color: #10a37f;
        }

        .container {
            max-width: 900px;
            margin: 50px auto;
            padding: 20px;
        }

        .welcome {
            text-align: center;
            margin-bottom: 35px;
        }

        .welcome h1 {
            font-size: 38px;
            margin-bottom: 12px;
        }

        .welcome p {
            color: #666;
            font-size: 17px;
        }

        .card {
            background: white;
            border: 1px solid #ddd;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            height: 220px;
            resize: vertical;
            border: 1px solid #ccc;
            border-radius: 10px;
            padding: 15px;
            font-size: 16px;
            outline: none;
        }

        textarea:focus {
            border-color: #10a37f;
        }

        .word-count {
            text-align: right;
            color: #777;
            margin-top: 7px;
            font-size: 14px;
        }

        .options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 25px;
        }

        .option select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
            background: white;
        }

        .generate-btn {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #10a37f;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .generate-btn:hover {
            background: #0d8f70;
        }

        .info {
            text-align: center;
            margin-top: 20px;
            color: #777;
            font-size: 13px;
        }

        @media (max-width: 700px) {
            .options {
                grid-template-columns: 1fr;
            }

            .welcome h1 {
                font-size: 30px;
            }

            .container {
                margin: 25px auto;
            }
        }
        .quiz-section {
    max-width: 900px;
    margin: 30px auto;
    padding: 25px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 15px;
}

.quiz-section h2 {
    margin-bottom: 25px;
}

.question-card {
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
}

.question-card h3 {
    margin-bottom: 15px;
}

.option {
    display: block;
    padding: 10px;
    margin: 8px 0;
    border: 1px solid #ddd;
    border-radius: 8px;
    cursor: pointer;
}

.option:hover {
    background: #f5f5f5;
}

.submit-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 9px;
    background: #10a37f;
    color: white;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
}

.result-box {
    margin-top: 20px;
    padding: 20px;
    border-radius: 10px;
    background: #f7f7f8;
    font-size: 18px;
    font-weight: bold;
}
    </style>
</head>

<body>

    <header class="header">
        <div class="logo">
            SmartQuiz <span>AI</span>
        </div>
    </header>

    <main class="container">

        <div class="welcome">
            <h1>What do you want to learn?</h1>
            <p>Enter any topic or study material and generate questions using AI.</p>
        </div>

        <div class="card">

            <label for="prompt">
                Enter your prompt
            </label>

            <textarea
                id="prompt"
                maxlength="10000"
                placeholder="Example: Generate questions from this topic: Operating System, process management, scheduling algorithms..."
            ></textarea>

            <div class="word-count">
                <span id="wordCount">0</span> / 1000 words
            </div>

            <div class="options">

                <div class="option">
                    <label>Questions</label>

                    <select id="questionCount">
                        <option value="5">5</option>
                        <option value="10" selected>10</option>
                        <option value="20">20</option>
                        <option value="30">30</option>
                        <option value="40">40</option>
                        <option value="50">50</option>
                    </select>
                </div>

                <div class="option">
                    <label>Question Type</label>

                    <select id="questionType">
                        <option value="mcq">MCQ</option>
                        <option value="true_false">True / False</option>
                        <option value="short_answer">Short Answer</option>
                    </select>
                </div>

                <div class="option">
                    <label>Difficulty</label>

                    <select id="difficulty">
                        <option value="easy">Easy</option>
                        <option value="medium" selected>Medium</option>
                        <option value="hard">Hard</option>
                    </select>
                </div>

            </div>

            <button class="generate-btn" onclick="generateQuestions()">
                ✨ Generate Questions
            </button>

            <div class="info">
                Maximum 1000 words • Maximum 50 questions • No login required
            </div>

        </div>
<div id="quizSection" class="quiz-section" style="display: none;">

    <h2>Your AI Generated Quiz</h2>

    <div id="quizContainer"></div>

    <button class="submit-btn" onclick="submitQuiz()">
        Submit Quiz
    </button>

    <div id="resultBox" class="result-box"></div>

</div>
    </main>
<script>

const promptBox = document.getElementById("prompt");
const wordCount = document.getElementById("wordCount");

promptBox.addEventListener("input", function () {

    let words = this.value.trim().split(/\s+/);

    if (this.value.trim() === "") {
        wordCount.textContent = 0;
        return;
    }

    if (words.length > 1000) {
        words = words.slice(0, 1000);
        this.value = words.join(" ");
    }

    wordCount.textContent = words.length;
});


let generatedQuestions = [];


async function generateQuestions() {

    const prompt = promptBox.value.trim();

    const questionCount =
        document.getElementById("questionCount").value;

    const questionType =
        document.getElementById("questionType").value;

    const difficulty =
        document.getElementById("difficulty").value;


    if (prompt === "") {
        alert("Please enter a prompt first.");
        return;
    }


    const button = document.querySelector(".generate-btn");

    button.disabled = true;
    button.textContent = "Generating...";


    try {

        const response = await fetch("/generate", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({

                prompt: prompt,
                questionCount: questionCount,
                questionType: questionType,
                difficulty: difficulty

            })

        });


        const data = await response.json();


        if (!response.ok) {
            throw new Error(data.error || "Something went wrong.");
        }


        generatedQuestions = data.questions;

        displayQuiz(generatedQuestions);


    } catch (error) {

        alert("Error: " + error.message);

    } finally {

        button.disabled = false;
        button.textContent = "✨ Generate Questions";

    }

}


function displayQuiz(questions) {

    const quizSection =
        document.getElementById("quizSection");

    const quizContainer =
        document.getElementById("quizContainer");


    quizContainer.innerHTML = "";


    questions.forEach((q, index) => {

        const card = document.createElement("div");

        card.className = "question-card";


        card.innerHTML = `

            <h3>
                Question ${index + 1}: ${q.question}
            </h3>

            ${q.options.map((option, optionIndex) => `

                <label class="option">

                    <input
                        type="radio"
                        name="question${index}"
                        value="${optionIndex}"
                    >

                    ${option}

                </label>

            `).join("")}

        `;


        quizContainer.appendChild(card);

    });


    document.getElementById("resultBox").innerHTML = "";


    quizSection.style.display = "block";


    quizSection.scrollIntoView({
        behavior: "smooth"
    });

}


function submitQuiz() {

    let correct = 0;
    let attempted = 0;


    generatedQuestions.forEach((q, index) => {

        const selected =
            document.querySelector(
                `input[name="question${index}"]:checked`
            );


        if (selected) {

            attempted++;


            const selectedOption =
                q.options[parseInt(selected.value)];


            if (selectedOption === q.answer) {
                correct++;
            }

        }

    });


    const total = generatedQuestions.length;

    const wrong = attempted - correct;

    const percentage =
        total > 0
        ? Math.round((correct / total) * 100)
        : 0;


    document.getElementById("resultBox").innerHTML = `

        <h2>🎯 Quiz Result</h2>

        <p>Total Questions: ${total}</p>

        <p>Attempted: ${attempted}</p>

        <p>Correct: ${correct}</p>

        <p>Wrong: ${wrong}</p>

        <p>Score: ${correct} / ${total}</p>

        <p>Percentage: ${percentage}%</p>

    `;

}

</script>
    

</body>

</html>
